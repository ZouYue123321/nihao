<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 读心镜 · MelodyZ</title><link rel="icon" href="../../assets/logo/favicon.svg"><link rel="stylesheet" href="../_shared/demo.css">
<style>
html,body{margin:0;min-height:100%;background:#0b0b0b;color:#fafaf8;font-family:var(--sans)}
main{max-width:760px;margin:0 auto;padding:76px 20px 70px;text-align:center}
h1{font:600 clamp(28px,4.4vw,44px)/1.3 var(--serif);letter-spacing:.08em;margin:0}
.sub{color:#8a8a85;font-size:13px;letter-spacing:.08em;margin:8px 0 22px}
.mirror{position:relative;width:100%;aspect-ratio:4/3;border:1px solid #2a2a28;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a1a19,#0b0b0b)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#c9c9c4;font-size:14px;line-height:1.8}
button{background:#fafaf8;color:#0b0b0b;border:0;border-radius:999px;padding:10px 26px;font:14px var(--sans);letter-spacing:.12em;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.res{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;text-align:left}
.card{border:1px solid #2a2a28;border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 10px;font:500 12px var(--sans);letter-spacing:.24em;color:#8a8a85}
.big{font:600 28px/1.2 var(--serif);letter-spacing:.06em}
.bars div{display:flex;align-items:center;gap:8px;font-size:12px;color:#c9c9c4;margin:5px 0}
.bars span{width:34px}.bars i{flex:1;height:4px;background:#222;border-radius:4px;overflow:hidden}.bars b{display:block;height:100%;background:#e9b8bf;width:0;transition:width .2s}
.priv{margin-top:18px;font-size:12px;color:#8a8a85;letter-spacing:.06em;line-height:1.8}
.priv b{color:#fafaf8;font-weight:500}
@media(max-width:560px){.res{grid-template-columns:1fr}.mirror{aspect-ratio:3/4}}
</style></head><body><main>
<h1>AI 读心镜</h1><p class="sub">看一眼镜头，AI 猜猜你现在的表情和年龄</p>
<div class="mirror"><video id="v" playsinline muted></video><canvas id="o"></canvas>
<div class="ph" id="ph"><div id="msg">正在加载识别模型…</div><button id="go" disabled>打开摄像头</button></div></div>
<div class="res"><div class="card"><h3>此刻的表情</h3><div class="big" id="emo">—</div><div class="bars" id="bars"></div></div>
<div class="card"><h3>AI 猜你的年龄</h3><div class="big" id="age">—</div><p style="font-size:12px;color:#8a8a85;margin:10px 0 0">只是模型的猜测，看个乐子，别当真</p></div></div>
<p class="priv">🔒 <b>画面不会离开你的设备。</b>所有识别都在你的浏览器里本地完成，不上传、不保存任何图像。</p>
</main>
<script src="lib/face-api.js"></script>
<script>
(function(){
var ZH={neutral:'平静',happy:'开心',sad:'难过',angry:'生气',fearful:'害怕',disgusted:'嫌弃',surprised:'惊讶'};
var v=document.getElementById('v'),o=document.getElementById('o'),ph=document.getElementById('ph'),msg=document.getElementById('msg'),go=document.getElementById('go');
var bars=document.getElementById('bars');bars.innerHTML=Object.keys(ZH).map(function(k){return '<div><span>'+ZH[k]+'</span><i><b id="b-'+k+'"></b></i></div>'}).join('');
var ready=false,ages=[];
Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri('model'),faceapi.nets.faceExpressionNet.loadFromUri('model'),faceapi.nets.ageGenderNet.loadFromUri('model')])
.then(function(){ready=true;window.__modelsReady=true;msg.textContent='模型已就绪。点击下方按钮，浏览器会询问摄像头权限。';go.disabled=false;})
.catch(function(e){console.warn(e);msg.textContent='模型加载失败，请检查网络后刷新页面。';});
go.onclick=function(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='这个浏览器不支持摄像头（或页面不是 https 打开的）。换个浏览器试试吧。';return;}
 go.disabled=true;msg.textContent='正在打开摄像头…';
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false}).then(function(s){v.srcObject=s;return v.play();}).then(function(){ph.style.display='none';loop();})
 .catch(function(e){go.disabled=false;go.textContent='再试一次';
  msg.textContent=(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))?'你没有允许使用摄像头。可以在浏览器地址栏左侧的权限设置里打开，再点「再试一次」。':(e&&(e.name==='NotFoundError'||e.name==='OverconstrainedError'))?'没有找到可用的摄像头。接上摄像头后再试一次吧。':'摄像头打开失败（可能被其他应用占用），稍后再试。';});
};
var opt=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5});
function loop(){if(v.paused||v.ended){return setTimeout(loop,300);}
 faceapi.detectSingleFace(v,opt).withFaceExpressions().withAgeAndGender().then(function(r){
  var dims={width:v.videoWidth,height:v.videoHeight};o.width=dims.width;o.height=dims.height;var c=o.getContext('2d');c.clearRect(0,0,o.width,o.height);
  if(r){var b=r.detection.box;c.strokeStyle='#e9b8bf';c.lineWidth=2;c.strokeRect(b.x,b.y,b.width,b.height);
   var ex=r.expressions,top=Object.keys(ZH).sort(function(a,b){return ex[b]-ex[a]})[0];
   document.getElementById('emo').textContent=ZH[top];Object.keys(ZH).forEach(function(k){document.getElementById('b-'+k).style.width=Math.round(ex[k]*100)+'%'});
   ages.push(r.age);if(ages.length>15)ages.shift();var a=ages.reduce(function(s,x){return s+x},0)/ages.length;document.getElementById('age').textContent='约 '+Math.round(a)+' 岁';
  }else{document.getElementById('emo').textContent='没看到脸';}
  requestAnimationFrame(loop);}).catch(function(e){console.warn(e);setTimeout(loop,500);});}
})();
</script>
<script src="../_shared/demo.js" data-name="face-api" data-license="MIT" data-repo="https://github.com/vladmandic/face-api"></script>
</body></html>
