<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 学飞 · MelodyZ</title><link rel="icon" href="../../assets/logo/favicon.svg"><link rel="stylesheet" href="../_shared/demo.css">
<style>
html,body{margin:0;min-height:100%;background:#0b0b0b;color:#fafaf8;font-family:var(--sans)}
main{max-width:560px;margin:0 auto;padding:72px 16px 60px;text-align:center}
h1{font:600 clamp(26px,4.4vw,40px)/1.3 var(--serif);letter-spacing:.08em;margin:0}
.sub{color:#8a8a85;font-size:13px;letter-spacing:.06em;margin:8px 0 18px;line-height:1.8}
canvas{width:100%;max-width:500px;height:auto;aspect-ratio:500/512;border:1px solid #2a2a28;border-radius:14px;display:block;margin:0 auto;touch-action:manipulation;filter:grayscale(.85) contrast(1.05) brightness(.9);cursor:pointer}
.sp{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.sp button{background:transparent;color:#fafaf8;border:1px solid #fafaf844;border-radius:999px;padding:6px 16px;font:13px var(--sans);cursor:pointer}
.sp button.on,.sp button:hover{background:#fafaf8;color:#0b0b0b}
.tip{color:#8a8a85;font-size:12px;margin-top:14px;line-height:1.8}
</style></head><body><main>
<h1>AI 学飞</h1><p class="sub">50 只小鸟各有一个小神经网络，撞柱就淘汰，最好的几只“繁衍”下一代。<br>看它们一代代学会飞，也可以点画面亲自操控粉圈那只，和 AI 比一比。</p>
<canvas id="flappy" width="500" height="512"></canvas>
<div class="sp" id="sp"><button data-f="60" class="on">1 倍速</button><button data-f="120">2 倍</button><button data-f="300">5 倍</button><button data-f="0">极速进化</button></div>
<p class="tip">点击 / 轻触画面或按空格：让你的小鸟往上飞 · 每一代开始时你的小鸟会重新出场</p>
</main>
<script src="Neuroevolution.js"></script><script src="game.js"></script>
<script>document.getElementById('sp').onclick=function(e){var b=e.target.closest('button');if(!b)return;speed(b.dataset.f);[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});};</script>
<script src="../_shared/demo.js" data-name="FlappyLearning" data-license="MIT" data-repo="https://github.com/xviniette/FlappyLearning"></script>
</body></html>
