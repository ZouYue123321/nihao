<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>材料预审工作台</title>
<style>
  :root {
    --bg: #e7eef1;
    --paper: #ffffff;
    --sheet: #fffefb;
    --ink: #1b3344;
    --muted: #3e5564;
    --faint: #5d7382;
    --navy: #16344a;
    --teal: #0e6e68;
    --teal-2: #0f5c58;
    --teal-soft: #e5f4f2;
    --line: #d3dee4;
    --amber: #8a5a12;
    --amber-soft: #fbf4e6;
    --green: #1c6b45;
    --green-soft: #e7f5ee;
    --hit: #fff1c2;
    --shadow: 0 1px 2px rgba(22, 52, 74, 0.06);
    --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    --serif: "Songti SC", "STSong", "SimSun", "PMingLiU", "WenQuanYi Micro Hei", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    font-size: 13.5px;
    line-height: 1.45;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  button.quiet { background: transparent; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }
  .topbar, .disclosure {
    background: var(--paper);
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { display: flex; gap: 10px; align-items: center; min-width: 220px; }
  .mark {
    width: 36px; height: 36px; border-radius: 9px;
    background: var(--navy); color: #fff;
    display: grid; place-items: center; font-weight: 700;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: 0.01em; }
  .eyebrow { margin: 0; color: var(--faint); font-size: 12px; }
  .rulemeta { color: var(--muted); font-size: 12px; line-height: 1.35; white-space: pre-line; }
  .reviewer { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex: 0 0 auto; }
  .reviewer span { white-space: nowrap; }
  .reviewer input { width: 132px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .disclosure {
    padding: 8px 14px;
    background: var(--teal-soft);
    color: var(--teal-2);
    font-weight: 650;
    border-bottom: 1px solid #c7e4e1;
  }
  .subnote { padding: 4px 14px 8px; background: var(--paper); color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
  .paneswitch { display: none; gap: 6px; padding: 8px 10px 0; }
  .paneswitch button[aria-selected="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .workbench {
    height: calc(100vh - 118px);
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr) 372px;
    gap: 10px;
    padding: 10px;
  }
  .pane {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }
  .pane-scroll { overflow: auto; padding: 10px; min-height: 0; }
  .pane-label {
    margin: 8px 4px 6px;
    font-size: 12px;
    color: var(--teal-2);
    font-weight: 700;
  }
  .case-btn, .mat-btn {
    width: 100%;
    text-align: left;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 6px;
    display: block;
  }
  .case-btn.is-on, .mat-btn.is-on { border-color: var(--teal); background: var(--teal-soft); }
  .case-top, .mat-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .case-name { font-weight: 700; }
  .case-sum, .meta { color: var(--faint); font-size: 12px; margin-top: 3px; }
  .case-initial summary { cursor: pointer; color: var(--faint); font-size: 12px; }
  .pill {
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 11px;
    border: 1px solid var(--line);
    white-space: nowrap;
    background: #f6f8f9;
  }
  .pill[data-state="pending-supplement"] { background: var(--amber-soft); color: var(--amber); border-color: #efd7ae; }
  .pill[data-state="pending-review"] { background: #eaf1f6; color: var(--navy); border-color: #c9d8e4; }
  .pill[data-state="pending-report"] { background: var(--teal-soft); color: var(--teal-2); border-color: #b7ddd9; }
  .pill[data-state="completed"] { background: var(--green-soft); color: var(--green); border-color: #b7e0c9; }
  .mat-btn.missing { border-style: dashed; color: var(--amber); background: #fffaf2; }
  .mat-btn.is-hit { box-shadow: inset 3px 0 0 var(--teal); background: var(--hit); }
  .center-head, .right-head {
    padding: 10px 12px 0;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .center-head h2, .right-head h2 { font-size: 15px; margin: 0; }
  .seg { display: flex; gap: 4px; flex: 0 0 auto; }
  .seg button { white-space: nowrap; }
  .seg button[aria-selected="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .sheet-wrap { display: grid; gap: 8px; }
  .sheet-wrap.compare { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .sheet {
    position: relative;
    background: var(--sheet);
    border: 1px solid #e4dcc8;
    border-radius: 10px;
    padding: 14px 14px 12px;
    overflow: hidden;
    font-family: var(--serif);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
  }
  .sheet.is-selected { border-color: var(--teal); }
  .sheet::after {
    content: "虚构样本";
    position: absolute;
    left: 8%;
    top: 32%;
    font-size: 42px;
    font-weight: 700;
    color: rgba(22, 52, 74, 0.06);
    transform: rotate(-16deg);
    pointer-events: none;
    font-family: var(--sans);
  }
  .sheet .kicker { color: #8a6a32; font-size: 12px; font-family: var(--sans); }
  .sheet h3 { margin: 4px 0 6px; font-size: 18px; }
  .sheet p { margin: 6px 0; font-size: 13px; }
  .sheet .row, .sheet .txn {
    display: grid;
    grid-template-columns: 108px minmax(0, 1fr);
    gap: 6px;
    padding: 3px 4px;
    border-radius: 4px;
    position: relative;
    z-index: 1;
  }
  .sheet .k { color: #6d5c40; }
  .sheet .v.unreadable {
    background: repeating-linear-gradient(-45deg, #f7f1e4, #f7f1e4 5px, #efe4cf 5px, #efe4cf 9px);
    color: #6b5738;
  }
  .is-hit { background: var(--hit); box-shadow: inset 3px 0 0 var(--teal); }
  .quality-banner {
    font-family: var(--sans);
    font-size: 12px;
    background: var(--amber-soft);
    color: var(--amber);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
  }
  .sheet-cap { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .fields { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fields th { text-align: left; font-size: 12px; color: var(--faint); font-weight: 650; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .fields td { padding: 6px 4px; border-bottom: 1px solid #e6eef2; vertical-align: top; }
  .tag {
    display: inline-block;
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 6px;
    background: #eef3f6;
    color: var(--navy);
  }
  .tag.warn { background: var(--amber-soft); color: var(--amber); }
  .tag.ok { background: var(--green-soft); color: var(--green); }
  .issue {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 8px;
    background: #fff;
  }
  .issue.is-selected { border-color: var(--teal); box-shadow: inset 3px 0 0 var(--teal); }
  .issue.resolved { background: #f7fbf9; }
  .issue.superseded { background: #f6f7f8; color: var(--muted); }
  .chip {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border-radius: 6px;
    padding: 2px 6px;
    background: #e8eef3;
    color: var(--navy);
  }
  .calc {
    background: #f5f8f9;
    border-radius: 8px;
    padding: 8px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .calc div { margin: 2px 0; }
  .complete-bar {
    border-top: 1px solid var(--line);
    padding: 8px 10px 10px;
    background: #fbfcfd;
  }
  .checkline { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--amber); margin: 6px 0; }
  .okhint { font-size: 12px; color: var(--green); margin: 6px 0; }
  .modal-back, .drawer-back {
    position: fixed; inset: 0;
    background: rgba(18, 36, 48, 0.35);
    z-index: 20;
    display: flex;
  }
  .modal-back { align-items: center; justify-content: center; padding: 16px; }
  .drawer-back { justify-content: flex-end; }
  .modal, .drawer {
    background: white;
    border-radius: 12px;
    width: min(560px, 100%);
    max-height: min(86vh, 820px);
    overflow: auto;
    padding: 14px;
    box-shadow: 0 12px 40px rgba(18, 36, 48, 0.2);
  }
  .drawer { width: min(640px, 100%); height: 100%; max-height: none; border-radius: 0; }
  .modal h3, .drawer h3 { margin: 0 0 8px; }
  label.stack { display: block; margin: 8px 0; font-size: 12px; color: var(--muted); }
  input[type="text"], textarea, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 8px;
    background: #fff;
  }
  textarea { min-height: 78px; resize: vertical; }
  .form-error { color: #8d3a3a; font-size: 12px; }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    border-radius: 999px;
    padding: 8px 14px;
    z-index: 30;
    max-width: min(640px, 92vw);
  }
  pre.report {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--sans);
    font-size: 12.5px;
    background: #f6f8f9;
    border-radius: 8px;
    padding: 10px;
  }
  .foot {
    padding: 0 14px 12px;
    color: var(--faint);
    font-size: 12px;
  }
  .testout { font-size: 12px; background: #f6f8f9; border-radius: 8px; padding: 8px; max-height: 240px; overflow: auto; }
  @media (max-width: 980px) {
    .workbench { height: auto; grid-template-columns: 1fr; }
    .pane { display: none; min-height: 70vh; }
    .pane.is-on { display: flex; }
    .paneswitch { display: flex; flex-wrap: wrap; }
    .actions { margin-left: 0; }
    .center-head .seg { width: 100%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="mark">预</div>
    <div>
      <h1>材料预审工作台</h1>
      <p class="eyebrow">个人消费贷款 · 单人复核 · 虚构演示</p>
    </div>
  </div>
  <div class="rulemeta" id="rule-meta"></div>
  <label class="reviewer"><span>复核人</span>
    <input id="reviewer-name" type="text" value="复核员（演示）" maxlength="20" autocomplete="off">
  </label>
  <div class="actions">
    <button type="button" id="btn-recheck">重新检查</button>
    <button type="button" id="btn-supplement">补充或替换</button>
    <button type="button" id="btn-report" class="primary">报告</button>
    <button type="button" id="btn-export-txt">导出 TXT</button>
    <button type="button" id="btn-export-json">导出 JSON</button>
    <button type="button" id="btn-reset-case">重置本案</button>
  </div>
</header>
<div class="disclosure" id="disclosure-banner"></div>
<div class="subnote">差异只提示需要人工说明。这里不判断真实性、欺诈、信用、可贷性，也不给出额度、利率、通过或拒绝。</div>
<nav class="paneswitch" id="pane-switch"></nav>
<main class="workbench">
  <aside class="pane is-on" id="pane-cases" data-pane="cases"></aside>
  <section class="pane" id="pane-center" data-pane="center"></section>
  <aside class="pane" id="pane-issues" data-pane="issues"></aside>
</main>
<p class="foot" id="page-foot"></p>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast" class="toast" hidden></div>
<script id="precheck-engine">
"use strict";
(function () {
  var RULE_VERSION = "DEMO-RULES-1.0.0";
  var BASELINE_DATE = "2026-11-24";
  var DISCLOSURE = "内置虚构材料 · 模拟字段抽取 · 规则真实计算 · 不构成贷款审批";
  var NOT_A_DECISION = "这只说明材料需要人工解释，不是贷款审批、额度、利率、征信、通过或拒绝。";
  var SEED_AT = "2026-11-24T01:00:00.000Z";
  var TYPE_ORDER = ["application", "identity", "income", "statement"];
  var TYPE_LABEL = {
    application: "贷款申请书",
    identity: "模拟身份证明",
    income: "收入证明",
    statement: "账户流水"
  };
  var STATE_LABEL = {
    "pending-review": "待复核",
    "pending-supplement": "待补充",
    "pending-report": "待出报告",
    completed: "已完成"
  };
  var CATEGORY_LABEL = {
    salary: "工资入账",
    bonus: "奖金",
    transfer: "转账",
    refund: "退款",
    unknown: "类别未知"
  };
  var FIELD_DEFS = {
    application: [
      { key: "applicantName", label: "申请人", kind: "name", required: true },
      { key: "mockId", label: "模拟证件号", kind: "id", required: true },
      { key: "applicationDate", label: "申请日期", kind: "date", required: true },
      { key: "loanPurpose", label: "贷款用途", kind: "text", required: true },
      { key: "declaredMonthlyIncomeCents", label: "申报月收入", kind: "cents", required: true },
      { key: "requestedAmountCents", label: "申请金额", kind: "cents", required: false }
    ],
    identity: [
      { key: "name", label: "姓名", kind: "name", required: true },
      { key: "mockId", label: "模拟证件号", kind: "id", required: true },
      { key: "validFrom", label: "有效期起", kind: "date", required: true },
      { key: "validTo", label: "有效期止", kind: "date", required: true }
    ],
    income: [
      { key: "name", label: "姓名", kind: "name", required: true },
      { key: "mockId", label: "模拟证件号", kind: "id", required: true },
      { key: "employerName", label: "工作单位", kind: "text", required: true },
      { key: "monthlyIncomeCents", label: "月收入", kind: "cents", required: true },
      { key: "issueDate", label: "开具日期", kind: "date", required: true },
      { key: "periodStart", label: "收入期间起", kind: "date", required: true },
      { key: "periodEnd", label: "收入期间止", kind: "date", required: true }
    ],
    statement: [
      { key: "accountName", label: "户名", kind: "name", required: true },
      { key: "mockId", label: "模拟证件号", kind: "id", required: true },
      { key: "periodStart", label: "流水期间起", kind: "date", required: true },
      { key: "periodEnd", label: "流水期间止", kind: "date", required: true },
      { key: "transactions", label: "交易明细", kind: "transactions", required: true }
    ]
  };
  var NAME_SLOTS = [
    ["application", "applicantName", "申请书申请人"],
    ["identity", "name", "身份证明姓名"],
    ["income", "name", "收入证明姓名"],
    ["statement", "accountName", "流水户名"]
  ];
  var ID_SLOTS = [
    ["application", "mockId", "申请书模拟证件号"],
    ["identity", "mockId", "身份证明模拟证件号"],
    ["income", "mockId", "收入证明模拟证件号"],
    ["statement", "mockId", "流水模拟证件号"]
  ];
  var RULEBOOK = [
    { id: "R01", title: "必备材料", text: "当前卷内要同时有贷款申请书、模拟身份证明、收入证明、账户流水。缺一类就生成关键待办。这是演示清单，不是银行清单。" },
    { id: "R02", title: "未知与不可读", text: "必填字段当前值为空，或交易金额不可读，就保持空值，不补数，并生成关键待办。" },
    { id: "R03", title: "姓名与模拟证件号", text: "姓名做 NFKC、去掉空白和间隔号后比较；模拟证件号做 NFKC、去掉空白和连字符并转成大写后比较。界面保留原文。不一致只提示复核。" },
    { id: "R04", title: "日期与覆盖", text: "基准日固定为 2026-11-24。身份有效期须覆盖基准日。申请日不晚于基准日且不早于基准日前 30 日。收入证明开具日不晚于基准日且不早于基准日前 90 日。流水须为至少 3 个完整自然月，止日不晚于基准日且不早于基准日前 31 日。收入期间与流水期间都已知时必须相同。日期为空时不在本规则里补判。" },
    { id: "R05", title: "月收入数字", text: "只把类别为工资入账且金额可读的交易计入。合计除以完整自然月数，整数分向下取整，余数单独列示。再与申报月收入、收入证明月收入两两比较。差额绝对值大于 0 分就提示说明。奖金、转账、退款不计入。缺材料或期间未知时不编造数字。不用浮点。" },
    { id: "R06", title: "来源不确定", text: "材料版本若标记为不确定或不可读，就进入人工复核。不生成置信度、准确率或模型分数。" }
  ];

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function formatCents(cents) {
    if (cents == null || !isFiniteNumber(cents) || Math.round(cents) !== cents) return "—";
    var neg = cents < 0;
    var abs = Math.abs(cents);
    var yuan = Math.floor(abs / 100);
    var fen = abs % 100;
    return (neg ? "-" : "") + yuan + "." + String(fen).padStart(2, "0");
  }

  function isFiniteNumber(n) {
    return typeof n === "number" && isFinite(n);
  }

  function parseYuanToCents(input) {
    var s = String(input == null ? "" : input).trim().replace(/，/g, "").replace(/,/g, "");
    var matched = s.match(/^(\d{1,9})(?:\.(\d{1,2}))?$/);
    if (!matched) return null;
    return Number(matched[1]) * 100 + Number((matched[2] || "").padEnd(2, "0"));
  }

  function parseISODate(value) {
    if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    var y = Number(value.slice(0, 4));
    var m = Number(value.slice(5, 7));
    var d = Number(value.slice(8, 10));
    var utc = Date.UTC(y, m - 1, d);
    var dt = new Date(utc);
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return { y: y, m: m, d: d, utc: utc, text: value };
  }

  function daysBetween(earlier, later) {
    return Math.round((later.utc - earlier.utc) / 86400000);
  }

  function analyzeFullMonths(startStr, endStr) {
    var start = parseISODate(startStr);
    var end = parseISODate(endStr);
    if (!start || !end) return { ok: false, reason: "日期无法解析" };
    if (start.utc > end.utc) return { ok: false, reason: "起日晚于止日" };
    if (start.d !== 1) return { ok: false, reason: "起日不是当月 1 日，演示规则不把它当成完整自然月" };
    var last = new Date(Date.UTC(end.y, end.m, 0)).getUTCDate();
    if (end.d !== last) return { ok: false, reason: "止日不是当月最后一日，演示规则不把它当成完整自然月" };
    var months = (end.y - start.y) * 12 + (end.m - start.m) + 1;
    return { ok: true, months: months, start: start, end: end };
  }

  function normalizeName(value) {
    if (value == null) return null;
    return String(value).normalize("NFKC").replace(/[\s\u00B7\u2022\u30FB\u2027\u2219.．·]/g, "").toLowerCase();
  }

        var field = version.fields[def.key];
        if (!field || field.current == null) {
          bad.push({ key: def.key, label: def.label, sourceStatus: field ? field.sourceStatus : "missing" });
        }
      });
      if (material.type === "statement" && Array.isArray(readCurrent(version, "transactions"))) {
        readCurrent(version, "transactions").forEach(function (txn, index) {
          if (txn.readable === false || txn.amountCents == null) {
            bad.push({ key: "txn-" + index, label: "交易 " + (index + 1), sourceStatus: "unreadable" });
          }
        });
      }
      if (!bad.length) return;
      issues.push(makeIssue({
        key: "R02|unknown|" + material.id,
        ruleId: "R02",
        title: TYPE_LABEL[material.type] + "有未知或不可读字段",

        explanation: "这些位置保持未知，规则不填猜测值，也不给置信度。" + NOT_A_DECISION,
        evidence: [{

          versionId: version.id,
          type: material.type,
          label: TYPE_LABEL[material.type],
          anchors: bad.map(function (item) { return item.key; }),
          originalText: bad.map(function (item) {

      var current = readCurrent(version, slot[1]);
      if (current == null) return;
      rows.push({
        evidence: fieldEvidence(material, version, slot[1], slot[2]),
        normalized: normalize(current)
      });
    });
    if (rows.length < 2) return;
    var first = rows[0].normalized;
    var conflict = rows.some(function (row) { return row.normalized !== first; });
    if (!conflict) return;
    issues.push(makeIssue({
      key: key,
      ruleId: "R03",
      title: title,
      summary: rows.map(function (row) {
        return row.evidence.label + "原文「" + displayRaw(kind, row.evidence.current) + "」归一「" + row.normalized + "」";
      }).join("；") + "。",
      explanation: "比较使用归一结果，原文照录。归一后不同，只进入复核说明。" + NOT_A_DECISION,
      evidence: rows.map(function (row) { return row.evidence; })
    }));
  }

  function evaluateR04(caseObj, issues, notes) {
    var baseline = parseISODate(BASELINE_DATE);
    checkIdentityWindow(caseObj, issues, notes, baseline);
    checkOffset(caseObj, issues, notes, baseline, "application", "applicationDate", "申请日期", "R04|application-date", 30, "申请日");
    checkOffset(caseObj, issues, notes, baseline, "income", "issueDate", "开具日期", "R04|income-issue-date", 90, "收入证明开具日");
    checkStatementCoverage(caseObj, issues, notes, baseline);
    checkPeriodEquality(caseObj, issues, notes);
  }

  function checkIdentityWindow(caseObj, issues, notes, baseline) {
    var material = materialByType(caseObj, "identity");
    if (!material) return;
    var version = currentVersion(material);
    var rawFrom = readCurrent(version, "validFrom");
    var rawTo = readCurrent(version, "validTo");
    if (rawFrom == null || rawTo == null) {
      notes.push("身份证明有效期有空值，R04 不补判。");
      return;
    }
    var from = parseISODate(rawFrom);
    var to = parseISODate(rawTo);
    if (!from || !to) {
      issues.push(dateIssue("R04|identity-window", "身份证明有效期无法解析", material, version, ["validFrom", "validTo"]));
      return;
    }
    if (from.utc > baseline.utc || to.utc < baseline.utc) {
      issues.push(makeIssue({
        key: "R04|identity-window",
        ruleId: "R04",
        title: "身份证明有效期未覆盖基准日",
        summary: "有效期 " + rawFrom + " 至 " + rawTo + "，基准日 " + BASELINE_DATE + "。",
        explanation: "演示规则要求有效期起早于或等于基准日，有效期止晚于或等于基准日。" + NOT_A_DECISION,
        evidence: [fieldEvidence(material, version, "validFrom", "有效期起"), fieldEvidence(material, version, "validTo", "有效期止")]
      }));
      return;
    }
    notes.push("身份证明有效期覆盖基准日。");
  }

  function checkOffset(caseObj, issues, notes, baseline, type, key, label, issueKey, maxDays, name) {
    var material = materialByType(caseObj, type);
    if (!material) return;
    var version = currentVersion(material);
    var raw = readCurrent(version, key);
    if (raw == null) {
      notes.push(label + "为空，R04 不补判。");
      return;
    }
    var date = parseISODate(raw);
    if (!date) {
      issues.push(dateIssue(issueKey, label + "无法解析", material, version, [key]));
      return;
    }
    var gap = daysBetween(date, baseline);
    if (gap < 0 || gap > maxDays) {
      issues.push(makeIssue({
        key: issueKey,
        ruleId: "R04",
        title: name + "不在演示窗口内",
        summary: raw + " 距基准日 " + gap + " 天，窗口为 0 到 " + maxDays + " 天。",
        explanation: "日期窗口是写明的演示口径，不是银行时效政策。" + NOT_A_DECISION,
        evidence: [fieldEvidence(material, version, key, label)]
      }));
      return;
    }
    notes.push(name + "在窗口内（距基准日 " + gap + " 天）。");
  }

  function checkStatementCoverage(caseObj, issues, notes, baseline) {
    var material = materialByType(caseObj, "statement");
    if (!material) return;
    var version = currentVersion(material);
    var start = readCurrent(version, "periodStart");
    var end = readCurrent(version, "periodEnd");
    if (start == null || end == null) {
      notes.push("流水期间有空值，R04 不补判。");
      return;
    }
    var span = analyzeFullMonths(start, end);
    if (!span.ok) {
      issues.push(makeIssue({
        key: "R04|statement-coverage",
        ruleId: "R04",
        title: "流水期间不是足够的完整自然月",
        summary: span.reason + "。",
        explanation: "演示规则要求至少 3 个完整自然月，不用天数近似去凑。" + NOT_A_DECISION,
        evidence: [fieldEvidence(material, version, "periodStart", "流水期间起"), fieldEvidence(material, version, "periodEnd", "流水期间止")]
      }));
      return;
    }
    if (span.months < 3) {
      issues.push(makeIssue({
        key: "R04|statement-coverage",
        ruleId: "R04",
        title: "流水完整月数不足",
        summary: "完整自然月为 " + span.months + "，演示规则要求至少 3 个月。",
        explanation: NOT_A_DECISION,
        evidence: [fieldEvidence(material, version, "periodStart", "流水期间起"), fieldEvidence(material, version, "periodEnd", "流水期间止")]
      }));
      return;
    }
    var gap = daysBetween(span.end, baseline);
    if (gap < 0 || gap > 31) {
      issues.push(makeIssue({
        key: "R04|statement-coverage",
        ruleId: "R04",
        title: "流水止日不在演示窗口内",
        summary: end + " 距基准日 " + gap + " 天，窗口为 0 到 31 天。",
        explanation: NOT_A_DECISION,
        evidence: [fieldEvidence(material, version, "periodEnd", "流水期间止")]
      }));
      return;
    }
    notes.push("流水覆盖 " + span.months + " 个完整自然月，止日距基准日 " + gap + " 天。");
  }

  function checkPeriodEquality(caseObj, issues, notes) {
    var income = materialByType(caseObj, "income");
    var statement = materialByType(caseObj, "statement");
    if (!income || !statement) {
      notes.push("收入证明或流水不在卷，期间是否相同不另判。");
      return;
    }
    var iv = currentVersion(income);
    var sv = currentVersion(statement);
    var a0 = readCurrent(iv, "periodStart");
    var a1 = readCurrent(iv, "periodEnd");
    var b0 = readCurrent(sv, "periodStart");
    var b1 = readCurrent(sv, "periodEnd");
    if (a0 == null || a1 == null || b0 == null || b1 == null) {
      notes.push("有期间为空，R04 不把另一份材料的期间抄过去。");
      return;
    }
    if (a0 !== b0 || a1 !== b1) {
      issues.push(makeIssue({
        key: "R04|period-mismatch",
        ruleId: "R04",
        title: "收入期间与流水期间不同",
        summary: "收入证明 " + a0 + " 至 " + a1 + "，流水 " + b0 + " 至 " + b1 + "。",
        explanation: "两边都有明确日期但不相同时，不能当成同一口径。" + NOT_A_DECISION,
        evidence: [
          fieldEvidence(income, iv, "periodStart", "收入期间起"),
          fieldEvidence(income, iv, "periodEnd", "收入期间止"),
          fieldEvidence(statement, sv, "periodStart", "流水期间起"),
          fieldEvidence(statement, sv, "periodEnd", "流水期间止")
        ]
      }));
      return;
    }
    notes.push("收入证明期间与流水期间相同。");
  }

  function dateIssue(key, title, material, version, anchors) {
    return makeIssue({
      key: key,
      ruleId: "R04",
      title: title,
      summary: "字段里的日期文本不能按公历解析。",
      explanation: "无法解析时不推测一个相近日期。" + NOT_A_DECISION,
      evidence: anchors.map(function (anchor) {
        return fieldEvidence(material, version, anchor, anchor);
      })
    });
  }

  function evaluateR05(caseObj, issues) {
    var statement = materialByType(caseObj, "statement");
    var application = materialByType(caseObj, "application");
    var income = materialByType(caseObj, "income");
    if (!statement) {
      issues.push(makeIssue({
        key: "R05|compare-incomplete",
        ruleId: "R05",
        title: "没有流水，月收入比对未做",
        summary: "缺少账户流水，不编造工资入账。",
        explanation: NOT_A_DECISION,
        evidence: [{ missing: true, type: "statement", materialId: null, versionId: null, anchors: [], label: "账户流水" }]
      }));
      return;
    }
    var calc = buildCalculation(caseObj);
    if (calc.unclear.length) {
      issues.push(r05Issue("R05|unclear-inclusion", "有交易不能确认是否计入工资", "类别未知或金额不可读的交易没有计入，也没有被悄悄忽略。", calc));
      return;
    }
    if (!calc.fullMonths) {
      issues.push(r05Issue("R05|compare-incomplete", "流水期间不能用来算月均", calc.spanReason || "期间不完整。", calc));
      return;
    }
    var differed = calc.pairs.some(function (pair) { return pair.comparable && pair.diffCents !== 0; });
    if (differed) {
      issues.push(r05Issue("R05|amount-diff", "月收入数字不一致", "同一演示口径下，可比的月金额差额不为 0 分。", calc));
      return;
    }
    var incomeMonthly = income ? readCurrent(currentVersion(income), "monthlyIncomeCents") : null;
    if (!income || incomeMonthly == null || !application || readCurrent(currentVersion(application), "declaredMonthlyIncomeCents") == null) {
      issues.push(r05Issue("R05|compare-incomplete", "月收入比对未完成", "有一侧月金额不在卷或仍为空，规则不把它当成 0，也不补写。", calc));
    }
  }

  function r05Issue(key, title, summary, calc) {
    return makeIssue({
      key: key,
      ruleId: "R05",
      title: title,
      summary: summary,
      explanation: explainR05(calc),
      evidence: calc.evidence,
      calculation: calc
    });
  }

  function explainR05(calc) {
    var text = "口径：完整自然月内类别为工资入账且金额可读的交易，合计后按月数做整数分向下取整。申报月收入和收入证明月收入按各自文件上的每月金额读取。";
    if (calc.samePeriod === true) text += "收入证明期间与流水期间相同。";
    if (calc.samePeriod === false) text += "收入证明期间与流水期间不同。差额只说明各文件上的月金额数字不同，不能说成已经坐实的同一期间冲突。";
    if (calc.samePeriod == null) text += "至少一侧期间未知或材料不在卷。规则不补写期间。";
    return text + NOT_A_DECISION;
  }

  function buildCalculation(caseObj) {
    var statementMat = materialByType(caseObj, "statement");
    var applicationMat = materialByType(caseObj, "application");
    var incomeMat = materialByType(caseObj, "income");
    var statement = statementMat ? currentVersion(statementMat) : null;
    var application = applicationMat ? currentVersion(applicationMat) : null;
    var income = incomeMat ? currentVersion(incomeMat) : null;
    var txns = statement ? (readCurrent(statement, "transactions") || []) : [];
    var span = statement ? analyzeFullMonths(readCurrent(statement, "periodStart"), readCurrent(statement, "periodEnd")) : { ok: false, reason: "无流水" };
    var included = [];
    var excluded = [];
    var unclear = [];
    txns.forEach(function (txn, index) {
      var item = {
        anchor: "txn-" + index,
        date: txn.date,
        category: txn.category,
        amountCents: txn.amountCents,
        summary: txn.summary,
        readable: txn.readable !== false && txn.amountCents != null
      };
      if (!item.readable) {
        item.reason = "不可读，未计入";
        unclear.push(item);
        return;
      }
      if (txn.category === "salary") included.push(item);
      else if (txn.category === "bonus" || txn.category === "transfer" || txn.category === "refund") {
        item.reason = categoryLabel(txn.category) + "，演示规则不计入工资";
        excluded.push(item);
      } else {
        item.reason = "类别未知，未计入";
        unclear.push(item);
      }
    });
    var total = 0;
    included.forEach(function (item) { total += item.amountCents; });
    var months = span.ok ? span.months : null;
    var declared = application ? readCurrent(application, "declaredMonthlyIncomeCents") : null;
    var incomeMonthly = income ? readCurrent(income, "monthlyIncomeCents") : null;
    var incomeStart = income ? readCurrent(income, "periodStart") : null;
    var incomeEnd = income ? readCurrent(income, "periodEnd") : null;
    var statementStart = statement ? readCurrent(statement, "periodStart") : null;
    var statementEnd = statement ? readCurrent(statement, "periodEnd") : null;
    var samePeriod = null;
    if (income && statement && incomeStart != null && incomeEnd != null && statementStart != null && statementEnd != null) {
      samePeriod = incomeStart === statementStart && incomeEnd === statementEnd;
    }
    var average = months ? Math.floor(total / months) : null;
    var remainder = months ? total % months : null;
    var evidence = [];
    if (application) evidence.push(fieldEvidence(applicationMat, application, "declaredMonthlyIncomeCents", "申报月收入"));
    if (income) evidence.push(fieldEvidence(incomeMat, income, "monthlyIncomeCents", "收入证明月收入"));
    if (statement) {
      evidence.push({
        materialId: statementMat.id,
        versionId: statement.id,
        type: "statement",
        label: "计入的工资入账",
        anchors: included.map(function (item) { return item.anchor; }).concat(unclear.map(function (item) { return item.anchor; })),
        originalText: included.map(function (item) { return blockText(statement, item.anchor); }).filter(Boolean).join("；"),
        extracted: total,
        current: total,
        normalized: null
      });
    }
    return {
      basis: "仅计入 category=salary 且金额可读的交易；月均 = 合计 ÷ 完整自然月数，整数分向下取整",
      periodStart: statementStart,
      periodEnd: statementEnd,
      months: months,
      fullMonths: !!span.ok,
      spanReason: span.ok ? "" : span.reason,
      incomePeriodStart: incomeStart,
      incomePeriodEnd: incomeEnd,
      samePeriod: samePeriod,
      salaryCount: included.length,
      salaryTotalCents: total,
      averageCents: average,
      remainderCents: remainder,
      declaredCents: declared,
      incomeMonthlyCents: incomeMonthly,
      pairs: [
        makePair("申报月收入", declared, "工资月均", average),
        makePair("申报月收入", declared, "收入证明月收入", incomeMonthly),
        makePair("收入证明月收入", incomeMonthly, "工资月均", average)
      ],
      included: included,
      excluded: excluded,
      unclear: unclear,
      evidence: evidence
    };
  }

  function makePair(left, leftCents, right, rightCents) {
    if (leftCents == null || rightCents == null) {
      return { left: left, right: right, leftCents: leftCents, rightCents: rightCents, diffCents: null, comparable: false };
    }
    return { left: left, right: right, leftCents: leftCents, rightCents: rightCents, diffCents: leftCents - rightCents, comparable: true };
  }

  function evaluateR06(caseObj, issues) {
    caseObj.materials.forEach(function (material) {
      var version = currentVersion(material);
      if (version.extractionQuality !== "uncertain" && version.extractionQuality !== "unreadable") return;
      issues.push(makeIssue({
        key: "R06|quality|" + material.id,
        ruleId: "R06",
        title: TYPE_LABEL[material.type] + "来源标记为不确定",
        summary: "版本 " + version.label + " 的抽取质量是 " + version.extractionQuality + "。",
        explanation: "这是样本上的演示标记，不是模型分数。需要人工看原文。" + NOT_A_DECISION,
        evidence: [{
          materialId: material.id,
          versionId: version.id,
          type: material.type,
          label: TYPE_LABEL[material.type],
          anchors: [],
          originalText: version.extractionNote,
          quality: version.extractionQuality
        }]
      }));
    });
  }

  function buildPasses(issues, r04notes, caseObj) {
    var passes = [];
    function has(ruleId) {
      return issues.some(function (issue) { return issue.ruleId === ruleId; });
    }
    if (!has("R01")) passes.push({ ruleId: "R01", title: "必备材料齐全", summary: "申请书、模拟身份证明、收入证明、账户流水都有当前版本。", calculation: null });
    if (!has("R02")) passes.push({ ruleId: "R02", title: "必填字段都有当前值", summary: "当前版本的必填字段没有留空，也没有不可读交易。空值没有被填上。", calculation: null });
    if (!has("R03")) passes.push({ ruleId: "R03", title: "姓名与模拟证件号归一后一致", summary: "在场材料的姓名、模拟证件号经过归一后各自相同。原文仍可在字段里查看。", calculation: null });
    if (!has("R04")) passes.push({ ruleId: "R04", title: "日期与覆盖符合演示窗口", summary: r04notes.join(""), calculation: null });
    if (!has("R05")) {
      var calc = buildCalculation(caseObj);
      passes.push({ ruleId: "R05", title: "可比的月收入数字一致", summary: "可比两侧的整数分差额为 0。未计入的交易见计算。", calculation: calc });
    }
    if (!has("R06")) passes.push({ ruleId: "R06", title: "当前版本没有不确定来源标记", summary: "没有材料被标成不确定或不可读。本规则不产生置信度。", calculation: null });
    return passes;
  }

  function mergeIssues(prev, next, at) {
    var prevMap = {};
    prev.forEach(function (issue) { prevMap[issue.key] = issue; });
    var used = {};
    var out = [];
    var reopened = [];
    var superseded = [];
    next.forEach(function (item) {
      used[item.key] = true;
      var old = prevMap[item.key];
      if (!old) {
        out.push(Object.assign({}, item, { openedAt: at }));
        return;
      }
      if (old.status === "superseded") {
        reopened.push(item.title);
        out.push(Object.assign({}, item, {
          openedAt: at,
          priorResolution: old.resolution || old.priorResolution || null,
          trail: old.trail.concat([{ at: at, type: "reopened", summary: "该事项再次出现。" }])
        }));
        return;
      }
      if (old.fingerprint === item.fingerprint && (old.status === "resolved" || old.status === "open")) {
        out.push(old);
        return;
      }
      if (old.status === "resolved" && old.fingerprint !== item.fingerprint) {
        reopened.push(item.title);
        out.push(Object.assign({}, item, {
          openedAt: old.openedAt || at,
          priorResolution: old.resolution,
          trail: old.trail.concat([{ at: at, type: "reopened", summary: "证据或规则结果已变化，原复核结论不再沿用。" }])
        }));
        return;
      }
      out.push(Object.assign({}, item, {
        openedAt: old.openedAt || at,
        priorResolution: old.priorResolution || null,
        trail: old.trail.concat([{ at: at, type: "evidence-updated", summary: "重新计算后，引用的证据已更新。" }])
      }));
    });
    prev.forEach(function (old) {
      if (used[old.key]) return;
      if (old.status === "superseded") {
        out.push(old);
        return;
      }
      superseded.push(old.title);
      out.push(Object.assign({}, old, {
        status: "superseded",
        supersededAt: at,
        trail: old.trail.concat([{ at: at, type: "superseded", summary: "当前规则结果已不再包含此项，记录保留。" }])
      }));
    });
    return { issues: out, reopened: reopened, superseded: superseded };
  }

  function deriveStatus(caseObj) {
    var open = caseObj.issues.filter(function (issue) { return issue.status === "open" && issue.blocking; });
    if (caseObj.completedAt && open.length === 0) return "completed";
    if (open.some(function (issue) { return issue.ruleId === "R01"; })) return "pending-supplement";
    if (open.length) return "pending-review";
    return "pending-report";
  }

  function describeCase(caseObj) {
    var open = caseObj.issues.filter(function (issue) { return issue.status === "open" && issue.blocking; });
    var missing = open.filter(function (issue) { return issue.ruleId === "R01"; });
    var others = open.filter(function (issue) { return issue.ruleId !== "R01"; });
    var status = deriveStatus(caseObj);
    var headline = "当前没有未决关键事项";
    var detail = "按现有材料和规则，关键事项已经清空，仍需人工确认后才算完成。";
    if (status === "completed") {
      headline = "预审已完成";
      detail = "当前没有未决关键事项，复核人已确认完成这次材料预审。";
    } else if (missing.length) {
      headline = missing.map(function (issue) { return issue.title; }).join("、");
      detail = "当前卷内没有：" + missing.map(function (issue) {
        return issue.title.indexOf("缺少") === 0 ? issue.title.slice(2) : issue.title;
      }).join("、") + "。";
      if (others.length) detail += "另外待说明：" + others.map(function (issue) { return issue.title; }).join("、") + "。";
    } else if (open.length === 1) {
      headline = open[0].title;
      detail = "当前待说明：" + open[0].title + "。";
    } else if (open.length > 1) {
      headline = "待说明 " + open.length + " 项";
      detail = "当前待说明：" + open.map(function (issue) { return issue.title; }).join("、") + "。";
    }
    return {
      headline: headline,
      detail: detail,
      initialTitle: caseObj.initialTitle,
      initialSummary: caseObj.initialSummary
    };
  }

  function pushEvent(caseObj, at, actor, type, summary, detail) {
    caseObj.events.push({
      id: "evt-" + (caseObj.events.length + 1),
      at: at,
      actor: actor,
      type: type,
      summary: summary,
      detail: detail || ""
    });
  }

  function clearCompletion(caseObj, at, actor, detail) {
    if (!caseObj.completedAt) return;
    pushEvent(caseObj, at, actor, "completion-invalidated", "完成后材料又有变动，预审重新打开。", detail);
    caseObj.completedAt = null;
    caseObj.completionActor = null;
    caseObj.humanConfirmed = false;
  }

  function recheck(caseObj, at) {
    var c = clone(caseObj);
    var evaluated = evaluate(c);
    var merged = mergeIssues(c.issues, evaluated.issues, at);
    c.issues = merged.issues;
    c.passes = evaluated.passes;
    c.lastCheckedAt = at;
    if (merged.reopened.length) {
      pushEvent(c, at, "规则引擎", "issue-reopened", "有事项重新打开", merged.reopened.join("、"));
    }
    if (merged.superseded.length) {
      pushEvent(c, at, "规则引擎", "issue-superseded", "有事项被新的结果取代", merged.superseded.join("、"));
    }
    return c;
  }

  function requireReason(reason, message) {
    var text = String(reason || "").trim();
    if (text.length < 4) return { ok: false, error: message };
    return { ok: true, text: text };
  }

  function correctField(caseObj, input) {
    var reason = requireReason(input.reason, "请填写至少 4 个字的更正理由。");
    if (!reason.ok) return reason;
    if (!String(input.actor || "").trim()) return { ok: false, error: "缺少复核人。" };
    var c = clone(caseObj);
    var material = c.materials.filter(function (item) { return item.id === input.materialId; })[0];
    if (!material) return { ok: false, error: "没有这份材料。" };
    var version = currentVersion(material);
    if (input.versionId && input.versionId !== version.id) return { ok: false, error: "只能更正当前版本。历史版本保持原样。" };
    var def = (FIELD_DEFS[material.type] || []).filter(function (item) { return item.key === input.fieldKey; })[0];
    if (!def) return { ok: false, error: "没有这个字段。" };
    if (def.kind === "transactions") return { ok: false, error: "交易明细不能逐笔猜测。请用内部样本替换整份流水。" };
    var parsed = coerce(def.kind, input.newValue);
    if (!parsed.ok) return parsed;
    var field = version.fields[def.key];
    if (field.current === parsed.value) return { ok: false, error: "新值与当前值相同，没有写入。" };
    field.corrections.push({ at: input.at, actor: input.actor, from: field.current, to: parsed.value, reason: reason.text });
    field.current = parsed.value;
    clearCompletion(c, input.at, input.actor, reason.text);
    pushEvent(c, input.at, input.actor, "field-corrected", "更正" + TYPE_LABEL[material.type] + " · " + def.label, displayRaw(def.kind, field.corrections[field.corrections.length - 1].from) + " → " + displayRaw(def.kind, parsed.value) + "。理由：" + reason.text);
    return { ok: true, case: recheck(c, input.at) };
  }

  function coerce(kind, raw) {
    if (kind === "cents") {
      var cents = parseYuanToCents(raw);
      if (cents == null) return { ok: false, error: "金额请写成元，最多两位小数，例如 15000.01。不接受科学计数法。" };
      return { ok: true, value: cents };
    }
    if (kind === "date") {
      var dateText = String(raw == null ? "" : raw).trim();
      if (!parseISODate(dateText)) return { ok: false, error: "日期请写成 YYYY-MM-DD，并且是真实存在的日期。" };
      return { ok: true, value: dateText };
    }
    var text = String(raw == null ? "" : raw).trim();
    if (!text) return { ok: false, error: "不能提交空值。未知字段会保持为空，直到有明确的人工更正。" };
    if (text.length > 40) return { ok: false, error: "不超过 40 个字。" };
    if (/[\r\n]/.test(text)) return { ok: false, error: "不能包含换行。" };
    return { ok: true, value: text };
  }

  function addMaterialVersion(caseObj, input) {
    var reason = requireReason(input.reason, "补充或替换需要至少 4 个字的理由。");
    if (!reason.ok) return reason;
    if (!String(input.actor || "").trim()) return { ok: false, error: "缺少复核人。" };
    var c = clone(caseObj);
    var preset = (c.presets || []).filter(function (item) { return item.id === input.presetId; })[0];
    if (!preset) return { ok: false, error: "没有这份内部样本。" };
    var material = materialByType(c, preset.type);
    var isNew = !material;
    if (!material) {
      material = { id: c.id + "-" + preset.type, type: preset.type, versions: [] };
      c.materials.push(material);
    }
    var version = clone(preset.version);
    version.id = material.id + "-v" + (material.versions.length + 1);
    version.label = preset.label;
    version.origin = isNew ? "supplement" : "replacement";
    version.addedAt = input.at;
    version.addedBy = input.actor;
    version.reason = reason.text;
    version.supersededAt = null;
    if (material.versions.length) material.versions[material.versions.length - 1].supersededAt = input.at;
    material.versions.push(version);
    clearCompletion(c, input.at, input.actor, reason.text);
    pushEvent(c, input.at, input.actor, isNew ? "material-supplemented" : "material-replaced", (isNew ? "补充" : "替换") + TYPE_LABEL[preset.type], preset.label + "。理由：" + reason.text);
    var checked = recheck(c, input.at);
    return { ok: true, case: checked, materialId: material.id, versionId: version.id };
  }

  function resolveIssue(caseObj, input) {
    var reason = requireReason(input.reason, "请填写至少 4 个字的复核理由。");
    if (!reason.ok) return reason;
    if (input.acknowledged !== true) return { ok: false, error: "请勾选确认：这是人工复核记录，没有猜测未知数值，也不是贷款结论。" };
    if (!String(input.actor || "").trim()) return { ok: false, error: "缺少复核人。" };
    var c = clone(caseObj);
    var issue = c.issues.filter(function (item) { return item.key === input.key; })[0];
    if (!issue || issue.status !== "open") return { ok: false, error: "这项不是未决事项。" };
    issue.status = "resolved";
    issue.resolution = {
      at: input.at,
      actor: input.actor,
      reason: reason.text,
      acknowledged: true,
      evidenceVersionIds: issue.evidence.map(function (item) { return item.versionId || null; }),
      statement: "人工复核记录。未知字段若仍为空，本操作没有填入数值。"
    };
    issue.trail.push({ at: input.at, type: "resolved", summary: "已记录复核结论。" });
    pushEvent(c, input.at, input.actor, "issue-resolved", "记录复核结论：" + issue.title, reason.text);
    var checked = recheck(c, input.at);
    var after = checked.issues.filter(function (item) { return item.key === input.key; })[0];
    if (!after || after.status !== "resolved") return { ok: false, error: "复核结论未能保留。证据可能已经变化。" };
    return { ok: true, case: checked };
  }

  function completeCase(caseObj, input) {
    if (input.humanConfirmed !== true) return { ok: false, error: "需要明确的人工确认。材料齐全的案件也不会自动完成。" };
    if (!String(input.actor || "").trim()) return { ok: false, error: "缺少复核人。" };
    var c = clone(caseObj);
    var open = c.issues.filter(function (issue) { return issue.status === "open" && issue.blocking; });
    if (open.length) return { ok: false, error: "还有 " + open.length + " 项未决关键事项，不能完成。可以先导出草稿报告。" };
    c.humanConfirmed = true;
    c.completedAt = input.at;
    c.completionActor = input.actor;
    pushEvent(c, input.at, input.actor, "completed", "复核人确认材料预审演示完成", "确认范围只到材料预审，不包括贷款审批、额度、利率或征信。");
    return { ok: true, case: c };
  }

  function recordExport(caseObj, input) {
    var c = clone(caseObj);
    pushEvent(c, input.at, input.actor, "export", input.kind === "json" ? "导出 JSON 状态快照" : "导出 TXT 报告", "本地文件，不是正式文书。");
    return c;
  }

  function resetCase(caseId) {
    return createInitialState().cases.filter(function (item) { return item.id === caseId; })[0];
  }

  function formatTime(iso) {
    var date = new Date(iso);
    if (Number.isNaN(date.getTime())) return String(iso || "");
    var fmt = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });
    return fmt.format(date) + "（" + iso + "）";
  }

  function formatCalculationLines(calc) {
    if (!calc) return [];
    var lines = [
      "口径：" + calc.basis,
      "流水期间：" + (calc.periodStart || "（空）") + " 至 " + (calc.periodEnd || "（空）") + (calc.fullMonths ? "，完整自然月 " + calc.months + " 个" : "，不能按完整自然月计算"),
      "收入证明期间：" + (calc.incomePeriodStart || "（空）") + " 至 " + (calc.incomePeriodEnd || "（空）"),
      "期间是否相同：" + (calc.samePeriod === true ? "相同" : calc.samePeriod === false ? "不相同" : "无法确认"),
      "工资入账笔数：" + calc.salaryCount,
      "工资入账合计：" + formatCents(calc.salaryTotalCents) + " 元（" + calc.salaryTotalCents + " 分）",
      "月均整数：" + (calc.averageCents == null ? "—" : formatCents(calc.averageCents) + " 元（" + calc.averageCents + " 分）"),
      "余数：" + (calc.remainderCents == null ? "—" : calc.remainderCents + " 分，未并入月均"),
      "申报月收入：" + (calc.declaredCents == null ? "（空）" : formatCents(calc.declaredCents) + " 元（" + calc.declaredCents + " 分）"),
      "收入证明月收入：" + (calc.incomeMonthlyCents == null ? "（空）" : formatCents(calc.incomeMonthlyCents) + " 元（" + calc.incomeMonthlyCents + " 分）")
    ];
    calc.pairs.forEach(function (pair) {
      lines.push(pair.left + " − " + pair.right + "：" + (pair.comparable ? formatCents(pair.diffCents) + " 元（" + pair.diffCents + " 分）" : "无法比较"));
    });
    calc.included.forEach(function (item) {
      lines.push("计入 " + item.date + " " + formatCents(item.amountCents) + " 元 " + item.summary);
    });
    calc.excluded.forEach(function (item) {
      lines.push("不计入 " + item.date + " " + categoryLabel(item.category) + " " + formatCents(item.amountCents) + " 元 " + item.summary);
    });
    calc.unclear.forEach(function (item) {
      lines.push("不能确认 " + (item.date || "") + " " + (item.reason || ""));
    });
    return lines;
  }

  function originLabel(origin) {
    if (origin === "supplement") return "补充";
    if (origin === "replacement") return "替换";
    return "原始样本";
  }

  function buildReportText(caseObj, meta) {
    var status = deriveStatus(caseObj);
    var lines = [
      "个人消费贷款材料预审演示报告",
      caseObj.completedAt ? "文本状态：已完成预审后的导出" : "文本状态：草稿（允许在未完成时导出）",
      "",
      DISCLOSURE,
      "",
      "本报告不构成贷款审批，不判断真实性、欺诈、信用或可贷性，也不给出额度、利率、通过或拒绝。",
      "规则版本：" + RULE_VERSION,
      "基准日：" + BASELINE_DATE,
      "规则是演示口径，不是银行制度，来源口径未作法律合规核验。",
      "字段来自内置样本直读，是模拟抽取，不是 OCR，没有置信度百分比。",
      "本地历程不是防篡改审计。",
      "",
      "案件编号：" + caseObj.id,
      "申请人：" + caseObj.applicant,
      "当前说明：" + describeCase(caseObj).headline + "。" + describeCase(caseObj).detail,
      "初始场景：" + caseObj.initialTitle + "。" + caseObj.initialSummary,
      "案件状态：" + STATE_LABEL[status],
      "复核人：" + (meta.reviewerName || ""),
      "生成时间：" + formatTime(meta.exportedAt),
      "人工确认：" + (caseObj.humanConfirmed && caseObj.completedAt ? "已于 " + formatTime(caseObj.completedAt) + " 由 " + (caseObj.completionActor || "") + " 确认" : "尚未确认"),
      "",
      "一、材料版本"
    ];
    TYPE_ORDER.forEach(function (type) {
      var material = materialByType(caseObj, type);
      if (!material) {
        lines.push(TYPE_LABEL[type] + "：不在卷");
        return;
      }
      material.versions.forEach(function (version, index) {
        lines.push(TYPE_LABEL[type] + " 版本 " + (index + 1) + " " + version.id + " · " + originLabel(version.origin) + (version.supersededAt ? " · 已被后续版本取代" : " · 当前版本"));
        lines.push("  加入时间：" + formatTime(version.addedAt) + " 操作者：" + version.addedBy);
        lines.push("  理由：" + version.reason);
        lines.push("  抽取说明：" + version.extractionNote + " 质量标记：" + version.extractionQuality);
        FIELD_DEFS[type].forEach(function (def) {
          if (def.kind === "transactions") {
            var txns = version.fields.transactions.current || [];
            lines.push("  交易明细当前 " + txns.length + " 笔；抽取原值 " + (version.fields.transactions.extracted || []).length + " 笔");
            txns.forEach(function (txn) {
              lines.push("    " + txn.date + " " + categoryLabel(txn.category) + " " + (txn.amountCents == null ? "（空）" : formatCents(txn.amountCents) + " 元") + " " + txn.summary);
            });
            return;
          }
          var field = version.fields[def.key];
          lines.push("  " + def.label + " 抽取原值：" + displayRaw(def.kind, field.extracted) + " 当前值：" + displayRaw(def.kind, field.current) + " 来源标记：" + field.sourceStatus);
          field.corrections.forEach(function (item) {
            lines.push("    更正 " + formatTime(item.at) + " " + item.actor + " " + displayRaw(def.kind, item.from) + " → " + displayRaw(def.kind, item.to) + " 理由：" + item.reason);
          });
        });
      });
    });
    lines.push("", "二、规则结果与计算");
    caseObj.passes.forEach(function (pass) {
      lines.push(pass.ruleId + " 通过 · " + pass.title);
      lines.push("  " + pass.summary);
      formatCalculationLines(pass.calculation).forEach(function (line) { lines.push("  " + line); });
    });
    caseObj.issues.forEach(function (issue) {
      lines.push(issue.ruleId + " " + issue.status + " · " + issue.title);
      lines.push("  " + issue.summary);
      lines.push("  " + issue.explanation);
      (issue.evidence || []).forEach(function (item) {
        lines.push("  证据 " + (item.label || "") + " 版本 " + (item.versionId || "无") + " 原文：" + (item.originalText || "（无原文块）"));
        if (item.current != null || item.extracted != null) {
          lines.push("    抽取原值：" + String(item.extracted) + " 规则读取值：" + String(item.current) + (item.normalized != null ? " 归一：" + String(item.normalized) : ""));
        }
      });
      formatCalculationLines(issue.calculation).forEach(function (line) { lines.push("  " + line); });
      if (issue.resolution) lines.push("  复核结论：" + issue.resolution.actor + " " + formatTime(issue.resolution.at) + " " + issue.resolution.reason);
      if (issue.priorResolution) lines.push("  曾有复核结论：" + issue.priorResolution.reason);
    });
    var unresolved = caseObj.issues.filter(function (issue) { return issue.status === "open" && issue.blocking; });
    lines.push("", "三、未决关键事项");
    if (!unresolved.length) lines.push("无。");
    unresolved.forEach(function (issue) { lines.push(issue.ruleId + " " + issue.key + " " + issue.title); });
    lines.push("", "四、复核人更正与理由");
    var corrections = 0;
    caseObj.materials.forEach(function (material) {
      material.versions.forEach(function (version) {
        Object.keys(version.fields).forEach(function (key) {
          version.fields[key].corrections.forEach(function (item) {
            corrections += 1;
            lines.push(TYPE_LABEL[material.type] + " " + version.id + " " + key + " " + String(item.from) + " → " + String(item.to) + " 理由：" + item.reason + " 操作者：" + item.actor);
          });
        });
      });
    });
    if (!corrections) lines.push("没有字段更正。");
    lines.push("", "五、历程");
    caseObj.events.forEach(function (event) {
      lines.push(formatTime(event.at) + " " + event.actor + " " + event.summary + (event.detail ? " " + event.detail : ""));
    });
    lines.push("", "完。刷新页面会丢弃本次内存中的改动。此文件不是银行审批结果。");
    return lines.join("\n");
  }

  function buildSnapshot(state, meta) {
    return {
      kind: "loan-material-precheck-demo-state",
      disclaimer: DISCLOSURE,
      notALoanDecision: true,
      notTamperProof: true,

      baselineDate: BASELINE_DATE,
      exportedAt: meta.exportedAt,
      reviewerName: meta.reviewerName,
      activeCaseId: meta.activeCaseId,
      cases: state.cases
    };
  }

  function runEngineTests() {

      results.push({ name: name, pass: !!cond, detail: cond ? "" : (detail || "") });

      return caseObj.issues.filter(function (issue) { return issue.status === "open"; }).map(function (issue) { return issue.key; }).sort();
    }
    function unique(issues) {
      var keys = issues.map(function (issue) { return issue.key; });
      return new Set(keys).size === keys.length;
    }

    var T3 = "2026-11-24T03:00:00.000Z";

  function renderSingle(caseObj, issue) {

  function renderFields(caseObj, issue) {

      tr.appendChild(currentCell);

      var action = h("td");

      tr.appendChild(action);

  function displayField(kind, value) {
    if (value == null || value === "") return "（空）";
    if (kind === "cents") return P.formatCents(value) + " 元 / " + value + " 分";

  function renderRight() {

    var head = h("div", { class: "right-head" }, h("div", {}, h("h2", { text: "复核" }), h("div", { class: "meta", text: "状态 " + P.STATE_LABEL[P.deriveStatus(caseObj)] })));

  function renderIssues(caseObj) {
    var box = h("div");

    open.forEach(function (issue) { box.appendChild(issueCard(caseObj, issue)); });
    if (resolved.length) {
      box.appendChild(h("div", { class: "pane-label", text: "已记录复核" }));
      resolved.forEach(function (issue) { box.appendChild(issueCard(caseObj, issue)); });
    }
    box.appendChild(h("div", { class: "pane-label", text: "规则通过项" }));
    caseObj.passes.forEach(function (pass) {
      var details = h("details");

  function issueCard(caseObj, issue) {

    var top = h("div", { class: "mat-top" }, h("span", { class: "chip", text: issue.ruleId }), h("span", { class: "meta", text: issue.status === "open" ? "未决" : issue.status === "resolved" ? "已复核" : "已取代" }));

    card.appendChild(h("p", { text: issue.summary }));
    var explain = h("details");
    explain.appendChild(h("summary", { text: "为什么进入复核" }));
    explain.appendChild(h("p", { text: issue.explanation }));
    card.appendChild(explain);
    (issue.evidence || []).forEach(function (item) {
      var quote = item.originalText || "（无）";

      card.appendChild(h("div", { class: "meta", text: (item.label || "证据") + " · 原文：" + quote }));

    var model = { cases: cases };
    var json = JSON.stringify(P.buildSnapshot(model, { reviewerName: actor(), exportedAt: nowIso(), activeCaseId: ui.caseId }), null, 2);
    download("预审状态-" + filePart(activeCase().applicant) + ".json", json, "application/json;charset=utf-8");
    commit(cases.filter(function (item) { return item.id === ui.caseId; })[0], "已下载 JSON 快照。");
  }

  function onRecheck() {
    var before = signature(activeCase());
    var next = P.recheck(activeCase(), nowIso());
    commit(next, signature(next) === before ? "已重新计算，未决事项没有增减。" : "已重新计算，事项已按当前材料更新。");
  }

  function signature(caseObj) {
    return caseObj.issues.map(function (issue) { return issue.key + issue.status + issue.fingerprint; }).sort().join("|");
  }

  document.getElementById("disclosure-banner").textContent = P.DISCLOSURE;
  document.getElementById("rule-meta").textContent = "规则 " + P.RULE_VERSION + "\n基准日 " + P.BASELINE_DATE;
  document.getElementById("page-foot").textContent = "规则为演示口径，未经法律合规核验，也不代表任何银行的材料要求。刷新页面即恢复内置样本，不写入本地存储。";
  document.getElementById("btn-recheck").addEventListener("click", onRecheck);
  document.getElementById("btn-supplement").addEventListener("click", function () { openSupplement(null); });
  document.getElementById("btn-report").addEventListener("click", openReport);
  document.getElementById("btn-export-txt").addEventListener("click", exportTxt);
  document.getElementById("btn-export-json").addEventListener("click", exportJson);
  document.getElementById("btn-reset-case").addEventListener("click", function () { openReset(false); });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") { closeModal(); closeDrawer(); }
  });
  render();
})();
</script>
