<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>万能粘贴台 · MelodyZ</title><link rel="icon" href="../../assets/logo/favicon.svg">
<link rel="stylesheet" href="../_shared/demo.css"><link rel="stylesheet" href="../_shared/tool.css"><script src="../_shared/tool.js"></script><script src="../_shared/img.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head><body><main class="tw">
<h1>万能粘贴台</h1>
<p class="sub">按 Ctrl / ⌘ + V，或把东西拖进来。它会认出你贴的是图片、链接、JSON、代码还是一段长文字，然后给出合适的操作。全部在本地完成。</p>
<div class="drop" id="drop"><b>在这里粘贴或拖入</b><br>图片 · 链接 · JSON · 代码 · 文字 · 文件</div>
<div class="card" style="margin-top:16px"><h3>手机上？贴到这里</h3><textarea id="ta" rows="3" placeholder="长按粘贴文字或链接…"></textarea>
<div class="row"><button class="btn pri" id="go">识别</button><button class="btn" id="cb">读取剪贴板</button><label class="btn" for="pick">选图片 / 文件</label><input id="pick" type="file" hidden>
<span class="hint">试试：</span><button class="btn" data-ex="url">链接</button><button class="btn" data-ex="json">JSON</button><button class="btn" data-ex="code">代码</button><button class="btn" data-ex="text">长文字</button></div></div>
<div class="card" id="out" hidden><h3 id="kind"></h3><div id="body"></div></div>
</main>
<script>
const EX={url:'https://www.example.com/article?id=42&utm_source=wechat&utm_medium=social&spm=a1.b2&from=timeline',
json:'[{"name":"Granola","type":"会议纪要","score":4.5},{"name":"Oboe","type":"AI 课程","score":4},{"name":"Lovable","type":"Vibe Coding","score":4.2}]',
code:'function debounce(fn, wait) {\n  let t;\n  return (...args) => {\n    clearTimeout(t);\n    t = setTimeout(() => fn(...args), wait);\n  };\n}',
text:'这周的产品复盘：\n1. 新手引导的跳出率还是偏高，需要重新看前三屏\n2. TODO 和设计同学对一下阅读页的提问卡片样式\n- 待办：整理 5 个竞品的引导方式\n用户访谈里大家提到最多的是「不知道从哪里开始读」，这其实说明我们的书单推荐和阅读计划应该更早出现。\n另外，下周要确认埋点方案，记得约研发。'};
const show=(k,html)=>{$('#out').hidden=false;$('#kind').innerHTML='识别为 · '+k;$('#body').innerHTML=html;$('#out').scrollIntoView({behavior:'smooth',block:'nearest'})};
const btns=a=>'<div class="row">'+a.map(([t,id,p])=>`<button class="btn${p?' pri':''}" id="${id}">${t}</button>`).join('')+'</div>';
function detect(s){s=s.trim();if(!s)return;
 if(/^https?:\/\/\S+$/i.test(s))return url(s);
 if(/^[\[{]/.test(s)){try{return json(JSON.parse(s),s)}catch(e){if(/^[\[{][\s\S]*[\]}]$/.test(s))return show('JSON（格式有误）',`<pre>${escH(e.message)}</pre><p class="hint">看起来像 JSON，但解析失败。</p>`)}}
 const lang=guess(s);if(lang)return code(s,lang);text(s)}
function url(s){let u;try{u=new URL(s)}catch(e){return text(s)}
 const junk=/^(utm_|spm|from|fbclid|gclid|share|scene|srcid|isappinstalled|wxshare|ref$|ref_)/i;const c=new URL(s);[...c.searchParams.keys()].forEach(k=>junk.test(k)&&c.searchParams.delete(k));const clean=c.toString();
 const qr=qrcode(0,'M');qr.addData(clean);qr.make();
 show('链接',`<div class="kv"><div><span>域名</span><b>${escH(u.hostname)}</b></div><div><span>参数</span><b>${[...u.searchParams].length} 个</b></div><div><span>去掉跟踪参数</span><b>${[...u.searchParams].length-[...c.searchParams].length} 个</b></div></div>
 <p class="hint" style="margin-top:14px">干净链接</p><pre>${escH(clean)}</pre>
 <div style="background:#fafaf8;display:inline-block;padding:10px;border-radius:10px;margin-top:14px">${qr.createSvgTag(4,0)}</div>
 ${btns([['复制干净链接','a1',1],['复制 Markdown 链接','a2'],['下载二维码','a3'],['打开','a4']])}`);
 $('#a1').onclick=()=>copy(clean);$('#a2').onclick=()=>copy(`[${u.hostname}](${clean})`);$('#a4').onclick=()=>open(clean,'_blank');
 $('#a3').onclick=()=>dl(new Blob([qr.createSvgTag(8,4)],{type:'image/svg+xml'}),'qrcode.svg');}
function toCSV(d){const rows=Array.isArray(d)?d:[d];if(!rows.every(r=>r&&typeof r==='object'))return null;const ks=[...new Set(rows.flatMap(Object.keys))];
 const q=v=>{v=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [ks.join(','),...rows.map(r=>ks.map(k=>q(r[k])).join(','))].join('\n')}
function json(d,raw){const pretty=JSON.stringify(d,null,2),csv=toCSV(d);
 show('JSON',`<div class="kv"><div><span>结构</span><b>${Array.isArray(d)?'数组 · '+d.length+' 项':'对象 · '+Object.keys(d).length+' 个字段'}</b></div><div><span>校验</span><b>✓ 合法</b></div></div><pre id="jp">${escH(pretty)}</pre>
 ${btns([['复制格式化','j1',1],['复制压缩版','j2'],csv?['下载 CSV','j3']:null,csv?['预览 CSV','j4']:null].filter(Boolean))}`);
 $('#j1').onclick=()=>copy(pretty);$('#j2').onclick=()=>copy(JSON.stringify(d));if(csv){$('#j3').onclick=()=>dl(new Blob(['\ufeff'+csv],{type:'text/csv'}),'data.csv');$('#j4').onclick=()=>$('#jp').textContent=csv}}
function guess(s){if(s.split('\n').length<2&&s.length<60)return null;const t=[['Python',/^\s*(def |import |from \S+ import|class \w+.*:|print\()/m],['HTML',/<\/?(div|span|html|body|p|a|script)[\s>]/i],['CSS',/[.#]?[\w-]+\s*\{[^}]*:[^}]*;/],['SQL',/\b(SELECT|INSERT|UPDATE|CREATE TABLE)\b[\s\S]*\b(FROM|INTO|SET|\()/i],['JavaScript',/\b(function|const|let|=>|console\.log)\b/],['Shell',/^\s*(\$ |sudo |npm |git |cd |curl )/m]];
 for(const[k,r]of t)if(r.test(s))return k;return /[;{}]\s*$/m.test(s)&&(s.match(/[{}();]/g)||[]).length>8?'代码':null}
function code(s,lang){const lines=s.split('\n');const fmt=()=>{let d=0;return lines.map(l=>l.trim()).filter((l,i,a)=>l||a[i-1]).map(l=>{if(/^[}\])]/.test(l))d=Math.max(0,d-1);const o='  '.repeat(d)+l;if(/[{\[(]$/.test(l))d++;return o}).join('\n')};
 show('代码',`<div class="kv"><div><span>语言（猜测）</span><b>${lang}</b></div><div><span>行数</span><b>${lines.length}</b></div><div><span>字符</span><b>${s.length}</b></div></div><pre id="cp">${escH(s)}</pre>
 ${btns([['整理缩进','c1',1],['复制','c2'],['复制为 Markdown 代码块','c3']])}`);
 let cur=s;$('#c1').onclick=()=>{cur=fmt();$('#cp').textContent=cur;toast('已整理缩进')};$('#c2').onclick=()=>copy(cur);$('#c3').onclick=()=>copy('```'+lang.toLowerCase()+'\n'+cur+'\n```')}
function text(s){const lines=s.split(/\n+/).map(l=>l.trim()).filter(Boolean);const chars=s.replace(/\s/g,'').length,words=(s.match(/[a-zA-Z]+/g)||[]).length,cjk=(s.match(/[\u4e00-\u9fa5]/g)||[]).length;
 const todo=lines.filter(l=>/(TODO|待办|要|需要|记得|确认|安排|跟进|约|整理|\[ \])/i.test(l)).map(l=>l.replace(/^([-*•]|\d+[.、)]|TODO[:：]?|待办[:：]?)\s*/i,''));
 const md=lines.map(l=>'- '+l.replace(/^([-*•]|\d+[.、)])\s*/,'')).join('\n'),long=s.length>120;
 show(long?'长文字':'文字',`<div class="kv"><div><span>字数</span><b>${chars}</b></div><div><span>汉字</span><b>${cjk}</b></div><div><span>英文单词</span><b>${words}</b></div><div><span>段落</span><b>${lines.length}</b></div><div><span>阅读时长</span><b>约 ${Math.max(1,Math.round(chars/400))} 分钟</b></div></div>
 ${todo.length?`<p class="hint" style="margin-top:16px">像待办的句子 · ${todo.length} 条</p><pre>${escH(todo.map(t=>'- [ ] '+t).join('\n'))}</pre>`:''}<pre id="tp">${escH(s)}</pre>
 ${btns([todo.length?['复制待办清单','t1',1]:null,['转为 Markdown 列表','t2'],['复制','t3'],['去掉多余空行','t4']].filter(Boolean))}`);
 if(todo.length)$('#t1').onclick=()=>copy(todo.map(t=>'- [ ] '+t).join('\n'));$('#t2').onclick=()=>{$('#tp').textContent=md;copy(md)};$('#t3').onclick=()=>copy(s);$('#t4').onclick=()=>{const c=lines.join('\n');$('#tp').textContent=c;copy(c)}}
async function image(blob,name){const img=await loadImg(URL.createObjectURL(blob));show('图片','<div id="ib"></div>');imgTools($('#ib'),img,name||'paste.png',blob.size)}
function file(f){if(f.type.startsWith('image/'))return image(f,f.name);
 if(/^text\/|json|xml|javascript/.test(f.type)||/\.(md|txt|csv|json|js|py|html|css)$/i.test(f.name))return f.text().then(detect);
 show('文件',`<div class="kv"><div><span>文件名</span><b>${escH(f.name)}</b></div><div><span>大小</span><b>${fmtSize(f.size)}</b></div><div><span>类型</span><b>${escH(f.type||'未知')}</b></div><div><span>修改时间</span><b>${new Date(f.lastModified).toLocaleDateString('zh-CN')}</b></div></div><p class="hint" style="margin-top:12px">想对文件做更多处理，可以去隔壁的 <a href="../file-drop/index.html">文件拖进来</a>。</p>`)}
document.addEventListener('paste',e=>{if(e.target===$('#ta'))return;const d=e.clipboardData;const f=[...d.files][0];if(f){e.preventDefault();return file(f)}const t=d.getData('text');if(t){e.preventDefault();detect(t)}});
const dr=$('#drop');['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dr.classList.add('on')}));['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dr.classList.remove('on')}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)return file(f);const t=e.dataTransfer.getData('text');if(t)detect(t)});
dr.onclick=()=>$('#ta').focus();$('#go').onclick=()=>detect($('#ta').value);$('#pick').onchange=e=>e.target.files[0]&&file(e.target.files[0]);
$('#cb').onclick=async()=>{try{const it=await navigator.clipboard.read();for(const i of it){const im=i.types.find(t=>t.startsWith('image/'));if(im)return image(await i.getType(im));if(i.types.includes('text/plain'))return detect(await (await i.getType('text/plain')).text())}}catch(e){try{detect(await navigator.clipboard.readText())}catch(_){toast('浏览器不让读剪贴板，长按输入框粘贴吧')}}};
document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{$('#ta').value=EX[b.dataset.ex];detect(EX[b.dataset.ex])});
</script>
<script src="../_shared/demo.js" data-name="PasteDrop" data-license="MIT" data-repo="https://github.com/Angel2mp3/PasteDrop"></script>
</body></html>
