<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>六词引导小游戏 · 先懂意思再拼写</title>
<style>
:root{--bg:#FBF6EE;--card:#fff;--ink:#1d1a17;--mut:#6f665c;--line:#ece3d6;--red:#E5322D;--soft:#fdecea;--ok:#2f8f5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'PingFang SC','Microsoft Yahei',system-ui,sans-serif;line-height:1.6}
button{font:inherit;cursor:pointer}.wrap{max-width:760px;margin:0 auto;padding:22px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:800}.brand i{display:inline-block;width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;font-style:normal;text-align:center;line-height:26px;margin-right:8px}
.steps{display:flex;gap:6px;margin:6px 0 18px}.steps b{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps b.on{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 12px 36px #6b4a2010}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--red);font-weight:700}
.word{font-size:46px;font-weight:900;text-align:center;margin:10px 0 4px;letter-spacing:.5px}.word button{font-size:18px;border:1px solid var(--line);background:#fff;border-radius:50%;width:38px;height:38px;vertical-align:middle;margin-left:8px}
h2{margin:14px 0 4px;font-size:24px}.sub{color:var(--mut);margin:0 0 14px}
.opts{display:grid;gap:10px}.opt{text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff}.opt:hover{border-color:var(--red)}.opt.ok{border-color:var(--ok);background:#eaf6ef}.opt.no{border-color:var(--red);background:var(--soft)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff8ec;border:1px dashed #e9c99a}.fb.ok{background:#eaf6ef;border-color:#9fd3b4}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:#fff}.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}.pri:disabled{opacity:.4}
.scene{background:#f6efe4;border-radius:16px;padding:16px;margin-bottom:14px}
.table{position:relative;height:200px}.top-board{position:absolute;left:28%;right:28%;top:86px;height:12px;background:#a87b52;border-radius:6px}.leg{position:absolute;top:96px;width:10px;height:70px;background:#8d6440;border-radius:4px}
.slot{position:absolute;width:46px;height:46px;border-radius:50%;border:2px dashed #b9a58b;background:#fffaf2;font-size:20px;color:#9b8466}.slot.ball,.ball0{background:var(--red);border:4px solid #ffd1cc}
.ball0{position:absolute;left:12%;top:20px;width:40px;height:40px;border-radius:50%;cursor:grab}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:10px}.roster div{background:#fff;border-radius:12px;padding:12px}.roster small{color:var(--mut)}
.ex{background:#fff8ec;border-radius:14px;padding:14px;margin:12px 0}.ex b{font-size:18px}.tip{border-left:4px solid var(--red);padding:6px 12px;background:#fff;border-radius:6px}
.mask{display:flex;justify-content:center;align-items:center;gap:6px;font-size:34px;font-weight:800;margin:16px 0}.mask input{width:auto;font:inherit;font-size:32px;text-align:center;border:none;border-bottom:3px solid var(--red);background:transparent;outline:none;color:var(--red)}
.spell input{width:100%;font-size:30px;text-align:center;padding:10px;border:2px solid var(--line);border-radius:14px;letter-spacing:3px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.sum div{background:#fff8ec;border-radius:14px;padding:14px;text-align:center}.sum b{display:block;font-size:28px;color:var(--red)}
.list div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 2px}
.intro p{margin:6px 0}.hidden{display:none}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><i>词</i>六词引导小游戏</div><small id="cnt" style="color:var(--mut)"></small></div>
<div id="app"></div></div>
<script>
// 六个词的词义、例句、情境题与记忆提示来自我自己做的《初中英语475词·智能引导式单词记忆系统》。
const W=[
{w:'below',zh:'在……下面',pos:'prep.',ex:'The shoes are below the shelf.',cn:'鞋子在架子的下方。',scene:'table',
 title:'把球放到桌子下面。',sub:'看清桌子的位置，把小球拖到（或点选）合适的地方。',choices:['上方','下方','旁边'],answer:1,
 hint1:'想想“下面”是比桌面更高还是更低？',hint2:'看桌腿之间、桌面下方那块区域。',success:'球放在了桌子下面。below 表示在某物更低的位置，不一定要紧贴或正好垂直对齐。',
 bridge:'在英文里，below 可以表示“在……下面”。',m:['be','low',''],cue:'读一遍完整的 below，再想想最后三个字母。'},
{w:'repair',zh:'修理',pos:'v.',ex:'Dad can repair the bike.',cn:'爸爸会修理这辆自行车。',scene:'bike',
 title:'这辆自行车坏了，应该修哪里？',sub:'仔细看看，自行车的链条松开了。选择真正能把它修好的做法。',choices:['擦亮车铃','把车链装回齿轮','给车身换颜色'],answer:1,
 hint1:'修理要解决损坏的问题，而不只是让东西变漂亮。',hint2:'问题出在脱落的车链，想想怎么让它重新正常工作。',success:'车链被装回齿轮，这个修复动作就是 repair（修理）。',
 bridge:'repair 的结尾是 pair。它只是帮助记住字母的线索，不是让你把每个字母分开读。',m:['re','pair',''],cue:'先读 repair，想一想 re 后面是哪四个字母。'},
{w:'absent',zh:'缺席',pos:'adj.',ex:'Tom was absent from school.',cn:'汤姆没来上学。',scene:'roster',
 title:'老师正在点名，谁今天没有来？',sub:'比较“应该到的同学”和“已经到的同学”。',choices:['小雨','小强','小林'],answer:0,
 hint1:'只看到空椅子还不能知道谁缺席，要对照名单。',hint2:'应到有小雨、小强、小林；已经到的是小强和小林。',success:'小雨应该来，却没有出现。我们说小雨 absent（缺席了）。',
 bridge:'Tom was absent from school. 汤姆没有来上学。',m:['ab','sen','t'],cue:'读一读 absent，想想 ab 与最后的 t 之间是什么字母。'},
{w:'amazing',zh:'令人惊奇的；惊人的',pos:'adj.',ex:'The view is amazing.',cn:'景色令人惊叹。',scene:'wow',
 title:'哪一件事会让人感到惊叹？',sub:'不要只看谁在笑，想想事件本身是不是令人惊奇。',choices:['同学用纸牌搭起两米高的塔','同学喝了一杯水','同学穿好鞋去上学'],answer:0,
 hint1:'amazing 形容事情令人惊奇或赞叹，而不是普通的开心。',hint2:'哪一件事让人忍不住说“哇，真不可思议！”？',success:'两米高的纸牌塔很令人惊叹，可以用 amazing 形容。',
 bridge:'amazing 的词尾是 -ing，前面要留意 z 和 i 的顺序。',m:['ama','zin','g'],cue:'先听 amazing，再留意中间的 z、i 和 n。'},
{w:'effort',zh:'努力',pos:'n.',ex:'Your effort will help you.',cn:'你的努力会帮助你。',scene:'try',
 title:'哪一段经历最能说明“付出了努力”？',sub:'不要只看结果有没有成功，看看谁真正投入了精力。',choices:['小林拿着奖杯拍照','小雨反复尝试并仔细检查，暂时仍没做对','小强看一眼难题就放下'],answer:1,
 hint1:'努力是认真付出的过程，不是奖杯，也不一定成功。',hint2:'谁虽然还没成功，却真正花时间认真尝试了？',success:'小雨认真付出了时间与精力，这就是 effort。努力不一定马上有好结果。',
 bridge:'effort 中间有两个 f；读整词的时候留意它们的拼写。',m:['e','ff','ort'],cue:'这个词有两个相邻的 f。'},
{w:'environment',zh:'环境',pos:'n.',ex:'We should protect our environment.',cn:'我们应该保护我们的环境。',scene:'env',
 title:'哪个地方可以叫作“环境”？',sub:'看看周围的地方和条件，想一想环境是不是只有花草树木。',choices:['只有有树木的公园','公园和城市街道都可以','只有捡垃圾的动作'],answer:1,
 hint1:'environment 指周围的环境本身，不是“保护环境”这个动作。',hint2:'人生活在街道，也会走进公园；两处都有周围的环境。',success:'公园和城市街道都属于 environment。它还可以指学习、工作或生活的周围条件。',
 bridge:'长单词可以按 en · vi · ron · ment 分组帮助记字母；这是书写记忆提示，不是精确发音拆分。',m:['envi','ronm','ent'],cue:'想想 environ 之后还有一个 m，再接 ent。'}];
const $=s=>document.querySelector(s),app=$('#app');
const STEP=['看情境懂意思','例句+记忆提醒','补出关键字母'];
let i=0,ph='start',t={},stats=W.map(()=>({tries:0,cueHint:0,cueOk:false,spell:null}));
function say(x){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function head(){const w=W[i];return `<div class="steps">${STEP.map((s,k)=>`<b class="${k<=['concept','bridge','cue'].indexOf(ph)?'on':''}"></b>`).join('')}</div><span class="tag">${STEP[['concept','bridge','cue'].indexOf(ph)]}</span><div class="word">${ph==="cue"?w.m[0]+"·".repeat(w.m[1].length)+w.m[2]:w.w}<button onclick="say('${w.w}')">♫</button></div>`}
function scene(w){
 if(w.scene==='table'){const pos=[[47,30],[47,118],[82,118]];return `<div class="scene"><div class="table" id="tbl"><div class="top-board"></div><div class="leg" style="left:30%"></div><div class="leg" style="left:68%"></div>
 ${t.sel==null?'<div class="ball0" draggable="true" id="ball" title="拖动小球"></div>':''}
 ${pos.map((p,k)=>`<button class="slot ${t.sel===k?'ball':''}" data-k="${k}" style="left:${p[0]}%;top:${p[1]}px;transform:translateX(-50%)">${t.sel===k?'':'＋'}</button>`).join('')}</div><small style="color:var(--mut)">拖动红色小球到圆圈，也可以直接点选位置（${w.choices.join(' / ')}）</small></div>`}
 if(w.scene==='roster')return `<div class="scene roster"><div><small>今天应该到</small><br><b>小雨 · 小强 · 小林</b></div><div><small>老师已经点到</small><br><b>小强 · 小林</b></div></div>`;
 return '';
}
function render(){$('#cnt').textContent=ph==='start'||ph==='done'?'':ph==='spell'?`默写 ${t.si+1}/6`:`第 ${i+1}/6 个词`;
 const w=W[i];let h='';
 if(ph==='start')h=`<div class="intro"><span class="tag">演示 Demo</span><h2>先弄懂意思，再动手拼写</h2><p class="sub">6 个初中重点词：below · repair · absent · amazing · effort · environment</p>
 <p>每个词三步：<b>①情境小游戏</b>（不直接给中文，在场景里判断）→ <b>②例句+记忆提醒</b> → <b>③补出关键字母</b>。</p><p>六个词学完，再<b>不看提示整词默写</b>，最后给出学习小结。</p>
 <p class="sub">答错会先给方向提示、再给具体提示，不直接揭晓答案。</p><div class="row"><span></span><button class="btn pri" onclick="go('concept')">开始体验 →</button></div></div>`;
 if(ph==='concept'){h=head()+`<h2>${w.title}</h2><p class="sub">${w.sub}</p>${scene(w)}`+(w.scene==='table'?'':`<div class="opts">${w.choices.map((c,k)=>`<button class="opt ${t.sel===k?(k===w.answer?'ok':'no'):''}" data-k="${k}">${k+1}　${c}</button>`).join('')}</div>`)
  +(t.fb?`<div class="fb ${t.done?'ok':''}">${t.fb}</div>`:'')+`<div class="row"><button class="btn" onclick="demo()">看看示范</button><button class="btn pri" ${t.done?'':'disabled'} onclick="go('bridge')">下一步 →</button></div>`}
 if(ph==='bridge')h=head()+`<p style="text-align:center;font-size:20px;margin:0"><b>${w.zh}</b> <small>${w.pos}</small></p><div class="ex"><b>${w.ex}</b> <button class="btn" onclick="say(\`${w.ex}\`)">♫ 听例句</button><br>${w.cn}</div><div class="tip"><small>记忆小提醒</small><br>${w.bridge}</div><div class="row"><button class="btn" onclick="go('concept')">← 上一步</button><button class="btn pri" onclick="go('cue')">遮住英文，试着记一记 →</button></div>`;
 if(ph==='cue')h=head()+`<p class="sub" style="text-align:center">${w.zh} · 少了 ${w.m[1].length} 个字母，填进去</p><div class="mask"><span>${w.m[0]}</span><input id="ci" maxlength="${w.m[1].length}" size="${w.m[1].length}" style="width:${w.m[1].length*0.75+0.6}em" autocomplete="off" value="${t.v||''}"><span>${w.m[2]}</span></div>`
  +(t.fb?`<div class="fb ${t.done?'ok':''}">${t.fb}</div>`:'')+`<div class="row"><button class="btn" onclick="cueHint()">给我一点提示</button>${t.done?`<button class="btn pri" onclick="nextWord()">${i<5?'下一个词 →':'开始默写 →'}</button>`:`<button class="btn pri" onclick="cueCheck()">检查一下 ↵</button>`}</div>`;
 if(ph==='spell'){const s=W[t.si];h=`<span class="tag">回头写一写 · 不看提示</span><h2 style="text-align:center">${s.zh}</h2><p class="sub" style="text-align:center">不看英文，把整个单词写出来（${s.w.length} 个字母）</p><div class="spell"><input id="si" autocomplete="off" value="${t.v||''}"></div>`
  +(t.fb?`<div class="fb ${t.ok?'ok':''}">${t.fb}</div>`:'')+`<div class="row"><button class="btn" onclick="say('${s.w}')">♫ 听一听</button>${t.fb?`<button class="btn pri" onclick="spellNext()">${t.si<5?'下一个 →':'看小结 →'}</button>`:`<button class="btn pri" onclick="spellCheck()">检查拼写 ↵</button>`}</div>`}
 if(ph==='done'){const one=stats.filter(s=>s.tries===0).length,sp=stats.filter(s=>s.spell).length,hint=stats.reduce((a,s)=>a+s.cueHint,0);
  h=`<span class="tag">学习小结</span><h2>六个词学完了 🎉</h2><div class="sum"><div><b>${one}/6</b>情境题一次做对</div><div><b>${sp}/6</b>独立默写正确</div><div><b>${hint}</b>次用了字母提示</div></div>
  <div class="list">${W.map((w,k)=>`<div><span><b>${w.w}</b> ${w.zh}</span><small>${stats[k].spell?'✅ 已能独立写出':'🔁 建议明天再练'}</small></div>`).join('')}</div><div class="row"><span></span><button class="btn pri" onclick="location.reload()">再玩一次</button></div>`}
 app.innerHTML=`<div class="card">${h}</div>`;bind()}
function bind(){
 document.querySelectorAll('.opt,.slot').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
 const ball=$('#ball');if(ball){ball.ondragstart=e=>e.dataTransfer.setData('t','b');document.querySelectorAll('.slot').forEach(s=>{s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();choose(+s.dataset.k)}})}
 const ci=$('#ci');if(ci){ci.focus();ci.oninput=()=>t.v=ci.value;ci.onkeydown=e=>{if(e.key==='Enter')t.done?nextWord():cueCheck()}}
 const si=$('#si');if(si){si.focus();si.oninput=()=>t.v=si.value;si.onkeydown=e=>{if(e.key==='Enter')t.fb?spellNext():spellCheck()}}}
function go(p){ph=p;t={};render();if(p==='concept')say(W[i].w)}
function choose(k){const w=W[i];if(t.done)return;if(t.sel===k&&k!==w.answer)return;t.sel=k;
 if(k===w.answer){t.done=true;t.fb='✓ '+w.success}else{stats[i].tries++;t.fb=(stats[i].tries===1?'💡 ':'🔍 ')+(stats[i].tries===1?w.hint1:w.hint2)}render()}
function demo(){const w=W[i];t.sel=w.answer;t.done=true;t.fb='示范：'+w.success;stats[i].tries=Math.max(1,stats[i].tries);render()}
function cueCheck(){const w=W[i],v=(t.v||'').trim().toLowerCase();if(!v)return;
 if(v===w.m[1]){t.done=true;stats[i].cueOk=true;t.fb=`✓ 完整拼写：<b>${w.w}</b>`;say(w.w)}else t.fb=`还差一点。${w.cue}`;render()}
function cueHint(){const w=W[i];stats[i].cueHint++;const n=Math.min(stats[i].cueHint,w.m[1].length);t.fb=stats[i].cueHint===1?w.cue:`第一个${n>1?'几':''}字母：<b>${w.m[1].slice(0,n)}</b>…`;render()}
function nextWord(){if(i<5){i++;go('concept')}else{ph='spell';t={si:0};render();}}
function spellCheck(){const s=W[t.si],v=(t.v||'').trim().toLowerCase();if(!v)return;t.ok=v===s.w;stats[t.si].spell=t.ok;t.fb=t.ok?`✓ 正确：${s.w}`:`正确拼写是 <b>${s.w}</b>，你写的是 ${v.replace(/</g,'')}。没关系，明天再练一次。`;render()}
function spellNext(){if(t.si<5){t={si:t.si+1};render()}else{ph='done';render()}}
render();
</script></body></html>
